<meta name="color-scheme" content="light dark">
<script>
(function () {
  var key = "warzag-theme";
  var meta = document.querySelector('meta[name="color-scheme"]');
  function saved() {
    try { return localStorage.getItem(key); } catch (error) { return null; }
  }
  function apply(theme) {
    meta.setAttribute("content", theme === "light" || theme === "dark" ? theme : "light dark");
  }
  var current = saved();
  if (current !== "light" && current !== "dark") current = "system";
  apply(current);
  document.addEventListener("DOMContentLoaded", function () {
    var footer = document.querySelector("footer");
    if (!footer) return;
    var line = document.createElement("p");
    var small = document.createElement("small");
    line.appendChild(small);
    function draw() {
      while (small.firstChild) small.removeChild(small.firstChild);
      small.appendChild(document.createTextNode("Theme: [ "));
      ["light", "dark", "system"].forEach(function (theme, index) {
        if (index) small.appendChild(document.createTextNode(" | "));
        var label = theme.charAt(0).toUpperCase() + theme.slice(1);
        if (theme === current) {
          var bold = document.createElement("b");
          bold.setAttribute("aria-current", "true");
          bold.textContent = label;
          small.appendChild(bold);
          return;
        }
        var link = document.createElement("a");
        link.href = "#";
        link.textContent = label;
        link.addEventListener("click", function (event) {
          event.preventDefault();
          current = theme;
          try {
            if (theme === "system") localStorage.removeItem(key);
            else localStorage.setItem(key, theme);
          } catch (error) {}
          apply(theme);
          draw();
        });
        small.appendChild(link);
      });
      small.appendChild(document.createTextNode(" ]"));
    }
    draw();
    footer.appendChild(line);
  });
})();
</script>
